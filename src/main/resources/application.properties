spring.application.name=ytbooster

# PostgreSQL DB connection (Production Ready)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/YTBOOSTER?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Papa1234@}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate (PostgreSQL Settings)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Connection Pool (Better Performance)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Thymeleaf (Same as before)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server (Works with Render.com)
server.port=${PORT:8989}

# Logging (Less verbose for production)
logging.level.org.springframework=WARN
logging.level.com.ytbooster=INFO

# PostgreSQL-specific optimizations (Optional)
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
