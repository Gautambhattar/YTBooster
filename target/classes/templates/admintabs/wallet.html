<div th:fragment="wallet">
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      background: #2a2a3d;
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      text-align: center;
    }
    th {
      background: #0d6efd;
      color: #fff;
      font-weight: bold;
    }
    tr:nth-child(even) { background: #242434; }
    tr:hover { background: #33334d; }
    .amount-credit { color: #28a745; font-weight: bold; }
    .amount-debit { color: #dc3545; font-weight: bold; }
    .form-inline { display: flex; gap: 10px; justify-content: center; }
    input, select, button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
    }
    input, select { background: #1e1e2f; color: #fff; }
    button {
      background: #0d6efd;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0b5ed7; }
  </style>

  <div class="card">
    <h3>💰 Wallet Recharge Management</h3>

    <!-- Manual wallet credit/debit form -->
    <form th:action="@{/admin/wallet/manual}" method="post" class="form-inline">
      <input type="text" name="userId" placeholder="User ID" required>
      <input type="number" name="amount" placeholder="Amount" required>
      <select name="type">
        <option value="CREDIT">Credit</option>
        <option value="DEBIT">Debit</option>
      </select>
      <button type="submit">Apply</button>
    </form>

    <br />

    <!-- Wallet history table -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>User</th>
          <th>Amount</th>
          <th>Type</th>
          <th>Balance After</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="txn : ${walletHistory}">
          <td th:text="${txn.id}"></td>
          <td th:text="${txn.userId}"></td>
          <td th:text="${txn.amount}"
              th:classappend="${txn.type == 'CREDIT'} ? 'amount-credit' : 'amount-debit'"></td>
          <td th:text="${txn.type}"></td>
          <td th:text="${txn.balanceAfter}"></td>
          <td th:text="${#temporals.format(txn.createdAt,'dd-MM-yyyy HH:mm')}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
